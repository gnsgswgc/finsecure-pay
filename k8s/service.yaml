# Public entry point: AWS creates a load balancer and gives it an external hostname.
apiVersion: v1
kind: Service
metadata:
  name: finsecure-pay
  namespace: finsecure
  labels:
    app: finsecure
spec:
  type: LoadBalancer
  selector:
    app: finsecure
  ports:
    - name: http
      port: 80
      targetPort: http
