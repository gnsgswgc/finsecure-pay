spring:
  application:
    name: finsecure-pay

server:
  port: 8080
  shutdown: graceful

app:
  # Defaults to the Maven project version; overridden by APP_VERSION in Kubernetes
  version: ${APP_VERSION:@project.version@}

finsecure:
  validation:
    max-amount: 10000
    allowed-currencies: SGD,USD,EUR

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
