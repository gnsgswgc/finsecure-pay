# kube-prometheus-stack settings for FinSecure Pay (sized for t3.small nodes).
# Install:
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f monitoring/kube-prometheus-values.yaml
#
# The Alertmanager config (SMTP login, alert email address) is NOT in Git.
# It lives in the Kubernetes Secret 'alertmanager-finsecure', created by
# monitoring/create-alertmanager-secret.sh.

# EKS manages the control plane, so these components cannot be scraped
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up every ServiceMonitor / PrometheusRule, not only the chart's own
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 900Mi

alertmanager:
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-finsecure
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  # Admin password is generated by the chart and stored in a Kubernetes Secret
  defaultDashboardsTimezone: Asia/Singapore
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 300Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 200Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
