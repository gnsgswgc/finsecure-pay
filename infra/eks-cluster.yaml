# EKS cluster for FinSecure Pay.
# Create:  eksctl create cluster -f infra/eks-cluster.yaml   (~15-20 min)
# Delete:  eksctl delete cluster -f infra/eks-cluster.yaml   (stops all charges)
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: finsecure-eks
  region: ap-southeast-1
  version: "1.36"
  tags:
    project: finsecure-pay
    purpose: capstone

iam:
  withOIDC: true

managedNodeGroups:
  - name: workers
    # t3.small is Free-plan eligible. 3 nodes leave room for the monitoring
    # stack (a t3.small holds at most 11 pods and has 2 GB of memory).
    instanceType: t3.small
    desiredCapacity: 3
    minSize: 2
    maxSize: 4
    volumeSize: 20
    labels:
      role: workers
    iam:
      withAddonPolicies:
        cloudWatch: true   # lets Fluent Bit write app logs to CloudWatch Logs
    tags:
      project: finsecure-pay

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: metrics-server

cloudWatch:
  clusterLogging:
    enableTypes: []
